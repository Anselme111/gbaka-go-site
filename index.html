<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gbaka Go</title>
<meta name="theme-color" content="#D3450B">
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #F7F9FA; --ink: #102A43; --muted: #4A5B6C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1A2A; --ink: #EAF1F7; --muted: #A9B8C6; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg);
    color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; text-align: center; }
  img { height: 56px; width: auto; }
  p { color: var(--muted); max-width: 30em; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Gbaka Go">
  <p>Les gbakas et wôrô-wôrôs d’Abidjan, en temps réel. L’application arrive bientôt sur Android.</p>
</main>
</body>
</html>
